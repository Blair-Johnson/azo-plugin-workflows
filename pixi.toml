[workspace]
name = "azo-plugin-workflows"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

# Runtime dependencies (including PyYAML) are supplied by the Agent Zoo host.
[tool.agent-zoo.plugin]
name = "azo-plugin-workflows"
# Workers and controllers both run the default pipeline; RLM sub-agents do not need workflows.
common = []
default = ["src/workflows.py"]
rlm = []

[tasks]
test = "bash scripts/test.sh"

[tool.agent-zoo.plugin.config]
files = ["skills/workflows/SKILL.md"]
